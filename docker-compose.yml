name: seein

services:
  clickhouse:
    # Current LTS line; receives 26.3 patch updates without jumping stable branches.
    image: clickhouse/clickhouse-server:26.3
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: seein
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  core:
    # Keep the worker architecture explicit and reproducible on Docker Desktop.
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    ports:
      - "8787:8787"
    env_file:
      - path: .env
        required: false
    # These override .env. The env file carries secrets and tuning; which drivers
    # the worker uses is a property of this image, not of the developer's machine.
    environment:
      HOST: 0.0.0.0
      PUBLIC_BASE_URL: http://localhost:8787
      DATA_ROOT: /data
      # The image ships Blender, Xvfb, and qwen-mm-plugins[blender], so the real
      # recipe executor is always used here. The deterministic driver is a CI fixture
      # that collapses every asset to a single cube.
      BLENDER_DRIVER: qwen-mcp
      CONTEXT_DRIVER: clickhouse
      SCREENSHOT_DRIVER: playwright
      CLICKHOUSE_URL: http://clickhouse:8123
      QWEN_MCP_COMMAND: qwen-mm-plugins-blender
      QWEN_MM_AUTOLAUNCH: "1"
      QWEN_MM_CACHE: /data/qwen-cache
      XDG_CACHE_HOME: /data/qwen-cache
      # Must match the Dockerfile, or XDG_CACHE_HOME above silently relocates
      # Playwright's browser lookup to an empty directory on the volume.
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
    volumes:
      - ./data:/data
    depends_on:
      clickhouse:
        condition: service_healthy
    shm_size: "2gb"
