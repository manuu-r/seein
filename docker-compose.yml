name: seein

services:
  clickhouse:
    # Current LTS line; receives 26.3 patch updates without jumping stable branches.
    image: clickhouse/clickhouse-server:26.3
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: seein
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  core:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    ports:
      - "8787:8787"
    env_file:
      - path: .env
        required: false
    # These override .env. The runtime has one generation path: Gemini writes R3F
    # source, the backend compiles it, and Playwright renders it.
    environment:
      HOST: 0.0.0.0
      PUBLIC_BASE_URL: http://localhost:8787
      DATA_ROOT: /data
      # Keep routine UI polling out of Docker logs. Workflow/provider calls still
      # print with destinations, timings, retries, and errors in a readable format.
      LOG_FORMAT: pretty
      LOG_LEVEL: info
      LOG_HTTP_REQUESTS: "false"
      CONTEXT_DRIVER: clickhouse
      CLICKHOUSE_URL: http://clickhouse:8123
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
    volumes:
      - ./data:/data
    depends_on:
      clickhouse:
        condition: service_healthy
    shm_size: "2gb"
