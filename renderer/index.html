<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SeeIn Scene Renderer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <div id="viewport"></div>
      <header class="overlay">
        <div>
          <span class="eyebrow">SeeIn</span>
          <h1 id="scene-title">Loading scene…</h1>
        </div>
        <div id="state-controls" class="state-controls" aria-label="Scene states"></div>
      </header>
      <aside id="workflow-panel" class="workflow-panel" hidden aria-live="polite">
        <div class="workflow-panel__header">
          <span class="eyebrow">Guided build</span>
          <strong id="workflow-node">Preparing…</strong>
        </div>
        <ol id="workflow-steps" class="workflow-steps"></ol>
        <p id="workflow-guidance" class="workflow-guidance"></p>
        <div id="workflow-action"></div>
      </aside>
      <div id="status" class="status">Loading assets…</div>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
