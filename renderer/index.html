<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SeeIn Surgical Anatomy</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <div id="viewport"></div>

      <!-- Entry. One field, nothing competing with it. -->
      <section id="launcher" class="launcher" hidden>
        <div class="launcher__inner">
          <header class="launcher__head">
            <p class="wordmark">SeeIn</p>
            <h1 class="launcher__title">What anatomy do you<br />need to see?</h1>
          </header>
          <form id="launcher-form" class="launcher__form">
            <textarea
              id="launcher-prompt"
              rows="2"
              required
              aria-label="Anatomy or procedure"
              placeholder="Right hepatic hilum for laparoscopic cholecystectomy, showing Calot&rsquo;s triangle"
            ></textarea>
            <div class="launcher__row">
              <button type="submit" id="launcher-submit">Build</button>
              <span class="launcher__kbd" aria-hidden="true"><kbd>Ctrl</kbd><kbd>Enter</kbd></span>
            </div>
            <p id="launcher-error" class="launcher__error" hidden></p>
            <p class="launcher__scope">Educational, non-patient-specific visualization. Not for diagnosis or clinical planning.</p>
          </form>
          <div id="launcher-examples" class="launcher__examples"></div>
          <aside id="launcher-recent" class="launcher__recent" hidden></aside>
        </div>
      </section>

      <!-- Console. Shows the one thing happening now; everything else on demand. -->
      <aside id="workflow-panel" class="console" hidden aria-live="polite">
        <header class="console__bar">
          <a class="console__home" href="/viewer/" aria-label="All runs">
            <span aria-hidden="true">&larr;</span> Runs
          </a>
          <button type="button" id="console-stop" class="console__stop" hidden>Stop run</button>
          <button
            type="button"
            id="console-toggle"
            class="console__toggle"
            aria-expanded="true"
            aria-controls="console-body"
          >Hide</button>
        </header>

        <div id="console-body" class="console__body">
          <!-- The answer to "what is it doing right now". -->
          <section class="now">
            <p class="now__label">
              <span id="workflow-progress" class="now__progress"></span>
              <span id="workflow-elapsed" class="now__elapsed" hidden></span>
            </p>
            <h2 id="workflow-node" class="now__node">Preparing</h2>
            <p id="workflow-guidance" class="now__guidance"></p>
            <div id="workflow-operation" class="now__operation" hidden>
              <p id="workflow-operation-label" class="now__operation-label"></p>
              <p id="workflow-operation-route" class="now__operation-route"></p>
              <p id="workflow-operation-detail" class="now__operation-detail"></p>
            </div>
          </section>

          <!-- The answer to "what does it need from me". Dominant when present. -->
          <div id="workflow-action" class="console__action"></div>

          <!-- Everything already done, folded away until asked for. -->
          <details id="activity" class="fold" open hidden>
            <summary>Activity &amp; diagnostics</summary>
            <ol id="workflow-steps" class="ledger"></ol>
            <ol id="activity-list" class="activity"></ol>
          </details>
        </div>
      </aside>

      <header class="scene-head">
        <h1 id="scene-title">Loading</h1>
        <div id="state-controls" class="state-controls" aria-label="Anatomy and procedure states"></div>
      </header>

      <div id="stage-empty" class="stage-empty" hidden>
        <p>The anatomy appears here once its evidence is approved and the model is built.</p>
      </div>

      <!-- Clarification takes the whole screen. It is the only thing being asked. -->
      <section id="flow" class="flow" hidden aria-label="Questions before research"></section>

      <!-- Decisions are modal: they block, so they should look like they block. -->
      <dialog id="modal" class="modal" aria-labelledby="modal-title"></dialog>

      <div id="status" class="readout"></div>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
